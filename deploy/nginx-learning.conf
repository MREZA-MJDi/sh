# داخل server { } سایت
client_max_body_size 12m;
client_body_timeout 300s;


# تیزر و پوسترها (دیسک public) مستقیم و کش‌شده از Nginx سرو شوند، نه از PHP
location ^~ /storage/ {
    alias /var/www/app/storage/app/public/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, immutable";
    location ~* \.mp4$ { mp4; mp4_buffer_size 1m; mp4_max_buffer_size 5m; }
}

# فایل‌های خصوصی هرگز مستقیم سرو نشوند
location ^~ /storage/app/private/ { deny all; }

# Optional: authorized recording delivery. Replace /var/www/app with the actual project root.
# Enable LEARNING_NGINX_PRIVATE_VIDEO only after nginx -t and direct-access 404 verification.
location ^~ /_protected_course_video/ {
    internal;
    alias /var/www/app/storage/app/private/private/course-videos/;
    disable_symlinks on;
    sendfile on;
    types { video/mp4 mp4; }
    default_type application/octet-stream;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
}
