; Dedicated test VPS configuration, install only in place of the matching existing program.
[program:sheykhan-default-worker]
directory=/var/www/sheykhan-test
command=/usr/bin/php /var/www/sheykhan-test/artisan queue:work redis --queue=default,licenses --sleep=3 --tries=3 --timeout=120 --memory=192 --max-time=3600
user=sheykhan
numprocs=1
umask=0007
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=180
redirect_stderr=true
stdout_logfile=/var/www/sheykhan-test/storage/logs/worker-default.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
