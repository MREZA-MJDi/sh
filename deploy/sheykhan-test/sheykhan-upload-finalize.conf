; Dedicated test VPS configuration, install only in place of the matching existing program.
[program:sheykhan-upload-finalize-worker]
directory=/var/www/sheykhan-test
command=/usr/bin/php /var/www/sheykhan-test/artisan queue:work upload-finalization --queue=upload-finalize --sleep=1 --tries=3 --timeout=900 --memory=192 --max-time=3600
user=sheykhan
numprocs=1
umask=0007
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/var/www/sheykhan-test/storage/logs/worker-finalize.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
