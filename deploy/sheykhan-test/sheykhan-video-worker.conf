; Dedicated test VPS configuration, install only in place of the matching existing program.
[program:sheykhan-video-worker]
directory=/var/www/sheykhan-test
command=/usr/bin/nice -n 10 /usr/bin/php /var/www/sheykhan-test/artisan queue:work video --queue=video,viewer-video --sleep=3 --tries=3 --timeout=3600 --memory=256 --max-time=3600
user=sheykhan
numprocs=1
umask=0007
autostart=true
autorestart=true
startsecs=3
startretries=3
stopasgroup=true
killasgroup=true
stopwaitsecs=3700
redirect_stderr=true
stdout_logfile=/var/www/sheykhan-test/storage/logs/worker-video.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
