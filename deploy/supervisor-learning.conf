; /etc/supervisor/conf.d/learning.conf  (مسیر پروژه و کاربر را عوض کن)

; صف سبک: لایسنس + پیش‌فرض (پیامک، ایمیل، ...)
[program:learning-default]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan queue:work --queue=licenses,default --sleep=3 --tries=3 --timeout=90 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/worker-default.log
stopwaitsecs=120

; صف سنگین ویدیو: فقط ۱ پردازش هم‌زمان تا CPU سایت را نخورد
[program:learning-video]
process_name=%(program_name)s_%(process_num)02d
command=nice -n 10 php /var/www/app/artisan queue:work video --queue=video --sleep=5 --tries=3 --timeout=3600 --max-time=7200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/worker-video.log
stopwaitsecs=3700

; صف نهایی‌سازی آپلود: اتصال تکه‌ها و ساخت رکورد ویدیو
[program:learning-upload-finalize]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/app/artisan queue:work upload-finalization --queue=upload-finalize --sleep=1 --tries=3 --timeout=900 --max-time=7200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/app/storage/logs/worker-upload-finalize.log
stopwaitsecs=1000
